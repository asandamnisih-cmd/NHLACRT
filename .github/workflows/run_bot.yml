name: Run CRT Master Bot

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy python-telegram-bot nest_asyncio

    - name: Run CRT Master Bot
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
      run: python NHLACRT.py
